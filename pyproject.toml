[project]
name = "epistolary"
version = "0.3.0"
description = "Answer email by hand on a reMarkable tablet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "openai>=1.43.0",
    "pillow>=10.4.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
]

[project.scripts]
epistolary = "epistolary.cli:cli"

# remarks is only on GitHub, and PyPI rejects packages that depend on a git URL,
# so it lives in a dependency group: `uv sync` installs it, `pip install epistolary` does not.
[dependency-groups]
dev = ["ipykernel>=6.29.5", "pytest>=8", "ruff>=0.6.3"]
remarkable = ["remarks"]

[tool.uv]
default-groups = ["dev", "remarkable"]

[tool.uv.sources]
remarks = { git = "https://github.com/azeirah/remarks", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
